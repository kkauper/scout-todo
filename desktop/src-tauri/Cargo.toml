[package]
name = "scout-desktop"
version = "0.1.0"
description = "Scout desktop app"
edition = "2021"

[lib]
name = "scout_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
