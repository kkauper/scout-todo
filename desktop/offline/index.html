<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scout</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1c1c1c;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      main {
        max-width: 360px;
        padding: 0 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 16px;
        opacity: 0.85;
      }
      button {
        display: none;
        border: none;
        border-radius: 6px;
        background: #ddfe5a;
        color: #1c1c1c;
        font-size: 14px;
        font-weight: 600;
        padding: 8px 16px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="status" role="status">
        <h1 id="heading">Opening Scout…</h1>
        <p id="message"></p>
      </div>
      <button id="retry" type="button">Retry now</button>
    </main>
    <script>
      var params = new URLSearchParams(location.search)
      var target = params.get('target') || 'https://scout.kauper.co'

      var heading = document.getElementById('heading')
      var message = document.getElementById('message')
      var retryButton = document.getElementById('retry')

      var retryTimer = null

      function showOffline() {
        heading.textContent = "Scout can't be reached"
        message.textContent = 'Check your internet connection. Retrying automatically…'
        retryButton.style.display = 'inline-block'
        scheduleRetry()
      }

      function scheduleRetry() {
        if (retryTimer) clearTimeout(retryTimer)
        retryTimer = setTimeout(tryOpen, 10000)
      }

      async function tryOpen() {
        try {
          await fetch(target + '/favicon.svg', { mode: 'no-cors', cache: 'no-store' })
          location.replace(target)
        }
        catch (e) {
          showOffline()
        }
      }

      retryButton.addEventListener('click', function () {
        heading.textContent = 'Opening Scout…'
        message.textContent = ''
        retryButton.style.display = 'none'
        tryOpen()
      })

      tryOpen()
    </script>
  </body>
</html>
